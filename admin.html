<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshy Admin</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand">Freshy Admin</div><a href="index.html" class="admin-link">Store</a></header>
<main>
<div id="loginBox" class="panel">
<h2>Admin Login</h2>
<form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="primary">Login</button></form>
<p id="loginMsg"></p></div>
<div id="adminApp" hidden>
<div class="panel"><div class="row"><h2>Products</h2><button onclick="logout()">Logout</button></div>
<form id="productForm" class="product-form"><input id="pname" placeholder="Product name" required><input id="pprice" type="number" step="0.01" placeholder="Price ₹" required><input id="pimage" placeholder="Image URL (optional)"><textarea id="pdesc" placeholder="Description"></textarea><button class="primary">Add Product</button></form>
<div id="productAdmin"></div></div>
<div class="panel"><h2>Orders</h2><div id="orders"></div></div>
</div></main>
<script src="config.js"></script><script src="admin.js"></script>
</body></html>
