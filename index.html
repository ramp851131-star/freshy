<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freshy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">Freshy</div><a href="admin.html" class="admin-link">Admin</a></header>
<main>
<section class="hero"><h1>Freshy</h1><p>Simple shopping with Cash on Delivery.</p></section>
<section><h2>Products</h2><div id="products" class="grid"></div></section>
</main>
<div id="cart" class="cart">
  <div class="cart-head"><b>Your Cart</b><button onclick="toggleCart()">×</button></div>
  <div id="cartItems"></div>
  <div class="total">Total: ₹<span id="total">0</span></div>
  <button class="primary" onclick="openCheckout()">Checkout — COD</button>
</div>
<button class="cart-btn" onclick="toggleCart()">🛒 Cart <span id="count">0</span></button>
<div id="checkout" class="modal">
 <div class="modal-box">
  <button class="close" onclick="closeCheckout()">×</button>
  <h2>Cash on Delivery</h2>
  <form id="orderForm">
   <input id="customerName" placeholder="Your name" required>
   <input id="phone" placeholder="Phone number" inputmode="tel" required>
   <textarea id="address" placeholder="Full delivery address" required></textarea>
   <button class="primary">Place COD Order</button>
  </form>
  <p id="orderMsg"></p>
 </div>
</div>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
