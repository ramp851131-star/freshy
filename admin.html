<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freshy Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f6f7f8;
color:#172018
}

header{
background:#fff;
border-bottom:1px solid #ddd;
padding:18px;
position:sticky;
top:0;
z-index:5
}

h1{
margin:0;
font-size:25px
}

main{
max-width:900px;
margin:auto;
padding:20px
}

.panel{
background:#fff;
padding:20px;
margin-bottom:20px;
border-radius:16px;
box-shadow:0 2px 10px #0000000d
}

input,textarea{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:9px;
font:inherit
}

textarea{
min-height:90px
}

button{
border:1px solid #ccc;
background:#fff;
border-radius:8px;
padding:10px 12px;
margin:4px;
cursor:pointer
}

.primary{
background:#111;
color:#fff;
border:0;
width:100%;
margin:6px 0
}

.order,
.product{
border:1px solid #eee;
border-radius:12px;
padding:14px;
margin:10px 0;
line-height:1.6
}

.location{
background:#111;
color:#fff;
border:0
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}
</style>
</head>

<body>

<header>
<h1>Freshy Admin</h1>
</header>

<main>

<!-- LOGIN -->

<div id="loginBox" class="panel">

<h2>Admin Login</h2>

<form id="loginForm">

<input
id="email"
type="email"
placeholder="Admin email"
required
>

<input
id="password"
type="password"
placeholder="Password"
required
>

<button
class="primary"
type="submit"
>
Login
</button>

</form>

<p id="loginMsg"></p>

</div>


<!-- ADMIN -->

<div id="adminApp" hidden>

<!-- PRODUCTS -->

<div class="panel">

<div class="row">

<h2>Products</h2>

<button onclick="logout()">
Logout
</button>

</div>


<form id="productForm">

<input
id="pname"
placeholder="Product name"
required
>

<input
id="pprice"
type="number"
step="0.01"
placeholder="Price ₹"
required
>

<input
id="pimage"
placeholder="Image URL (optional)"
>

<textarea
id="pdesc"
placeholder="Description"
></textarea>

<button
class="primary"
type="submit"
>
Add Product
</button>

</form>

<div id="productAdmin">
Loading products...
</div>

</div>


<!-- ORDERS -->

<div class="panel">

<h2>Customer Orders</h2>

<div id="orders">
Loading orders...
</div>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://jleeiaktplcsjpgmzopm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XGiJfYclvwJALSxtb-knpQ_QfUasbhv";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const $ =
id => document.getElementById(id);


const esc =
value =>
String(value ?? "")
.replace(
/[&<>"']/g,
m => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);


let editing = null;


/* LOGIN */

async function checkLogin(){

const result =
await db.auth.getSession();

if(result.data.session){

showAdmin();

}else{

showLogin();

}

}


function showLogin(){

$("loginBox").hidden=false;

$("adminApp").hidden=true;

}


function showAdmin(){

$("loginBox").hidden=true;

$("adminApp").hidden=false;

loadProducts();

loadOrders();

}


$("loginForm").onsubmit =
async function(e){

e.preventDefault();

$("loginMsg").textContent=
"Logging in...";


const result =
await db.auth.signInWithPassword({

email:
$("email").value.trim(),

password:
$("password").value

});


if(result.error){

$("loginMsg").textContent=
result.error.message;

return;

}


$("loginMsg").textContent="";

showAdmin();

};


async function logout(){

await db.auth.signOut();

location.reload();

}


/* PRODUCTS */

async function loadProducts(){

const result =
await db
.from("products")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(result.error){

$("productAdmin").textContent=
result.error.message;

return;

}


const data =
result.data || [];


$("productAdmin").innerHTML =
data.map(
p => `

<div class="product">

<b>
${esc(p.name)}
</b>

<br>

₹${Number(p.price).toFixed(2)}

<br>

<small>
${p.active ? "Visible" : "Hidden"}
</small>

<br>

<button
onclick="editProduct(${JSON.stringify(p).replace(/"/g,"&quot;")})"
>
Edit
</button>

<button
onclick="toggleProduct('${p.id}',${!p.active})"
>
${p.active ? "Hide" : "Show"}
</button>

<button
onclick="deleteProduct('${p.id}')"
>
Delete
</button>

</div>

`
).join("")
||
"<p>No products yet.</p>";

}


$("productForm").onsubmit =
async function(e){

e.preventDefault();


const product={

name:
$("pname").value.trim(),

price:
Number($("pprice").value),

image_url:
$("pimage").value.trim() || null,

description:
$("pdesc").value.trim(),

active:true

};


let result;


if(editing){

result =
await db
.from("products")
.update(product)
.eq("id",editing);

}else{

result =
await db
.from("products")
.insert(product);

}


if(result.error){

alert(result.error.message);

return;

}


editing=null;

e.target.reset();

e.target.querySelector("button")
.textContent="Add Product";

loadProducts();

};


function editProduct(product){

editing=product.id;

$("pname").value=
product.name;

$("pprice").value=
product.price;

$("pimage").value=
product.image_url || "";

$("pdesc").value=
product.description || "";

$("productForm")
.querySelector("button")
.textContent=
"Save Changes";

window.scrollTo(0,0);

}


async function toggleProduct(id,value){

const result =
await db
.from("products")
.update({active:value})
.eq("id",id);


if(result.error){

alert(result.error.message);

return;

}


loadProducts();

}


async function deleteProduct(id){

if(!confirm(
"Delete this product?"
)){

return;

}


const result =
await db
.from("products")
.delete()
.eq("id",id);


if(result.error){

alert(result.error.message);

return;

}


loadProducts();

}


/* CUSTOMER LOCATION */

function viewCustomerLocation(
latitude,
longitude
){

if(
latitude === null ||
latitude === undefined ||
longitude === null ||
longitude === undefined
){

alert(
"Customer location is not available."
);

return;

}


const mapsUrl =
"https://www.google.com/maps?q=" +
encodeURIComponent(
latitude + "," + longitude
);


window.open(
mapsUrl,
"_blank"
);

}


/* ORDERS */

async function loadOrders(){

const result =
await db
.from("orders")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(result.error){

$("orders").textContent=
result.error.message;

return;

}


const orders =
result.data || [];


$("orders").innerHTML =
orders.map(
o => `

<div class="order">

<b>
${esc(o.customer_name)}
</b>

<br>

📞 ${esc(o.phone)}

<br>

📍 ${esc(o.address)}

<br>

💰 Total:
₹${Number(o.total).toFixed(2)}

<br>

📦 Status:
<b>
${esc(o.status)}
</b>

<br>

<small>
${o.created_at
? new Date(o.created_at).toLocaleString()
: ""}
</small>

<br>


<!-- LOCATION BUTTON -->

<button
class="location"
onclick="viewCustomerLocation(
${o.latitude},
${o.longitude}
)"
>
📍 View Customer Location
</button>


<br>


<button
onclick="setStatus(
'${o.id}',
'Confirmed'
)"
>
Confirm
</button>


<button
onclick="setStatus(
'${o.id}',
'Shipped'
)"
>
Shipped
</button>


<button
onclick="setStatus(
'${o.id}',
'Delivered'
)"
>
Delivered
</button>

</div>

`
).join("")
||
"<p>No customer orders yet.</p>";

}


/* ORDER STATUS */

async function setStatus(
id,
status
){

const result =
await db
.from("orders")
.update({
status:status
})
.eq("id",id);


if(result.error){

alert(result.error.message);

return;

}


loadOrders();

}


/* START */

checkLogin();

</script>

</body>
</html>
